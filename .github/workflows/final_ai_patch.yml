name: Final BISM2202 source audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject stale final-report wording
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'How does order volume trend by Month-Year|100% bars compare|hourly combo chart|delay peak at 20:00|dashboard begins with demand location' \
            PROJECT/BISM2202_OUTPUT/COMMON/build_deliverables.py \
            PROJECT/BISM2202_OUTPUT/Version_A/report_answers.md \
            PROJECT/BISM2202_OUTPUT/Version_B/report_answers.md
          grep -q 'How does order volume trend across Order Month?' PROJECT/BISM2202_OUTPUT/Version_A/report_answers.md
          grep -q 'How does order volume trend across Order Month?' PROJECT/BISM2202_OUTPUT/Version_B/report_answers.md
      - name: Validate final ZIP contents
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          for version in ('A', 'B'):
              path = Path(f'FINAL_PACKAGES/BISM2202_Student_{version}_FINAL.zip')
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  assert names == [f'BISM2202_Assignment_{version}.pbix', f'BISM2202_Report_{version}.docx'], names
                  assert archive.testzip() is None
          print('FINAL_SOURCE_AND_PACKAGE_AUDIT: PASS')
          PY
