name: Validate final BISM2202 packages

on:
  push:
    branches: [main]
    paths:
      - 'FINAL_DELIVERABLES/**'
      - 'FINAL_PACKAGES/**'
      - 'automation/package_final.py'
      - '.github/workflows/package_final.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-extract and verify exact contents
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, tempfile, zipfile
          from pathlib import Path
          manifest=json.loads(Path('FINAL_PACKAGES/FINAL_PACKAGE_MANIFEST.json').read_text())
          assert manifest['status']=='PASS' and not manifest['issues']
          for v in ('A','B'):
              z=Path(f'FINAL_PACKAGES/BISM2202_Student_{v}_FINAL.zip')
              assert hashlib.sha256(z.read_bytes()).hexdigest().upper()==manifest['versions'][v]['zip_sha256']
              with tempfile.TemporaryDirectory() as d, zipfile.ZipFile(z) as a:
                  assert a.namelist()==[f'BISM2202_Assignment_{v}.pbix',f'BISM2202_Report_{v}.docx']
                  a.extractall(d)
                  assert len(list(Path(d).iterdir()))==2
          print('FINAL_PACKAGE_REEXTRACTION: PASS')
          PY
